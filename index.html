<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathAssets - Recursos Escolares</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Barra Lateral */
        .sidebar {
            width: 60px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            gap: 20px;
            z-index: 10;
        }
        .sidebar-icon {
            width: 35px;
            height: 35px;
            background-color: #21262d;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }
        .sidebar-icon:hover {
            background-color: #30363d;
        }
        /* Área Principal */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
        }
        .home-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .logo {
            font-size: 3rem;
            font-weight: 700;
            color: #58a6ff;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }
        .subtitle {
            font-size: 1rem;
            color: #8b949e;
            margin-bottom: 30px;
        }
        /* Barra de Busca */
        .search-container {
            width: 100%;
            max-width: 600px;
        }
        .search-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1rem;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 50px;
            color: #f0f6fc;
            outline: none;
            box-sizing: border-box;
        }
        .search-input:focus {
            border-color: #58a6ff;
        }
        /* Atalhos */
        .shortcuts {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }
        .shortcut-btn {
            padding: 10px 20px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
        }
        .shortcut-btn:hover {
            background-color: #30363d;
        }
        /* Janela do Navegador Oculta */
        .browser-view {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
    </style>
</head>
<body>

    <!-- Barra lateral com botões de controle -->
    <div class="sidebar">
        <div class="sidebar-icon" onclick="goHome()" title="Voltar para Home">🏠</div>
        <div class="sidebar-icon" onclick="openUrl('https://desmos.com')" title="Calculadora">🧮</div>
    </div>

    <div class="main-container">
        <!-- Tela Inicial Disfarçada -->
        <div class="home-screen" id="homeScreen">
            <div class="logo">Lucide</div>
            <div class="subtitle">Calculadora e Ferramentas Numéricas Avançadas</div>

            <div class="search-container">
                <input type="text" id="urlInput" class="search-input" placeholder="Digite o link do site (ex: google.com) e aperte Enter..." onkeypress="checkEnter(event)">
            </div>

            <div class="shortcuts">
                <div class="shortcut-btn" onclick="openUrl('https://desmos.com')">Desmos Calc</div>
                <div class="shortcut-btn" onclick="openUrl('https://wikipedia.org')">Pesquisa Escolar</div>
                <div class="shortcut-btn" onclick="openUrl('https://pageresource.com')">Jogos Retro</div>
            </div>
        </div>

        <!-- O Navegador Virtual Embutido -->
        <iframe id="virtualBrowser" class="browser-view"></iframe>
    </div>

    <script>
        // Função que abre o link na mesma tela
        function openUrl(url) {
            const home = document.getElementById('homeScreen');
            const browser = document.getElementById('virtualBrowser');
            
            // Corrige a URL caso o usuário digite sem o protocolo básico
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            home.style.display = 'none'; 
            browser.style.display = 'block'; 
            browser.src = url; 
        }

        // Função do botão de Casinha para limpar a tela e voltar ao Lucide
        function goHome() {
            const home = document.getElementById('homeScreen');
            const browser = document.getElementById('virtualBrowser');
            
            browser.style.display = 'none';
            browser.src = '';
            home.style.display = 'flex';
            document.getElementById('urlInput').value = '';
        }

        // Executa ao pressionar o botão Enter do teclado do celular
        function checkEnter(event) {
            if (event.key === 'Enter') {
                const inputValue = document.getElementById('urlInput').value;
                if (inputValue) {
                    openUrl(inputValue);
                }
            }
        }
    </script>

</body>
</html>
